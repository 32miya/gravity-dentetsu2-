<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぐらびてぃ電鉄2 買い占め列島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--or:#ff7a00;--or2:#c85e00;--ink:#2b2420;--paper:#fffaf0;--br:#7a5040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a6fb0;font-family:"DotGothic16",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
.btn{background:var(--or);color:#fff;font-size:18px;padding:12px 18px;border-radius:14px;box-shadow:0 5px 0 var(--or2);font-weight:bold;letter-spacing:.05em}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--or2)}
.btn.brown{background:var(--br);box-shadow:0 5px 0 #4e3027}
.btn.green{background:#3aa84a;box-shadow:0 5px 0 #23752f}
.btn.gray{background:#999;box-shadow:0 5px 0 #666}
.btn:disabled{opacity:.45}
#banner{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));background:#e6f1fc;border:3px solid #2b2420;border-radius:18px;padding:8px 12px;font-size:16px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25);z-index:5;min-height:42px}
#plist{position:fixed;left:8px;top:calc(64px + env(safe-area-inset-top));background:rgba(255,255,255,.93);border:2px solid #999;border-radius:12px;padding:6px 8px;font-size:13px;z-index:5;max-width:74vw}
#plist .row{display:flex;align-items:center;gap:5px;padding:2px 0;white-space:nowrap}
#plist .row.cur{background:#fff1c4;border-radius:6px}
#plist .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #222;flex:none}
#plist .nm{max-width:5.5em;overflow:hidden;text-overflow:ellipsis}
#plist .left{color:#e0306a}
#plist .mon{margin-left:auto;padding-left:6px;font-weight:bold}
#plist .neg{color:#d22}
#plist .head{font-size:12px;color:#666;border-bottom:1px solid #ccc;margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
#plist.mini .row:not(.cur){display:none}
#tools{position:fixed;right:8px;top:calc(64px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;z-index:5}
#tools button{width:44px;height:44px;border-radius:50%;background:#fff;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#actBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));z-index:6;font-size:22px;padding:14px 40px;white-space:nowrap}
#actBtn:active{transform:translateX(-50%) translateY(3px)}
#diceCv{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:20;pointer-events:none}
#dice .d{width:84px;height:84px;background:#fff;border:4px solid #222;border-radius:16px;font-size:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.35);font-weight:bold}
#dice .d.ex{background:#ffe27a}
#toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);background:#fff;border:3px solid var(--or);border-radius:16px;padding:12px 18px;font-size:18px;text-align:center;z-index:25;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:15;pointer-events:none;padding:0 10px calc(66px + env(safe-area-inset-bottom))}
#modal.center{align-items:center;background:rgba(0,0,0,.35);pointer-events:auto}
.card{pointer-events:auto;background:var(--paper);border:4px solid #2b2420;border-radius:20px;padding:14px;width:100%;max-width:480px;box-shadow:0 8px 0 rgba(0,0,0,.25);max-height:72vh;overflow:auto}
.card h2{margin:0 0 6px;font-size:19px;color:#e0306a;text-align:center}
.card .q{font-size:17px;text-align:center;margin:4px 0 12px;line-height:1.45}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{background:#e2f7f7;border:3px solid #13939a;border-radius:14px;font-size:16px;padding:12px 6px;color:#0b6e74;min-height:54px}
.choices button.ok{background:#c9f5c4;border-color:#2b9b2b;color:#185e18}
.choices button.ng{background:#ffd3d3;border-color:#d33;color:#8a1515}
.choices button:disabled{cursor:default}
.choices button.sel{background:#fff1c4;border-color:#e0a000;color:#7a5600}
.choices button.cut{opacity:.3;text-decoration:line-through}
.qbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#555;margin-bottom:2px}
.lv{display:block;font-size:13px;color:#c47a00;letter-spacing:.05em}
.tbar{position:relative;height:16px;background:#ddd;border-radius:8px;overflow:hidden;margin:4px 0 6px}
#qfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#3ab54a;transition:width .25s linear,background .3s}
#qtimer{position:absolute;right:8px;top:-1px;font-size:13px;color:#222}
.hint{text-align:center;font-size:13px;color:#2b8a2b;margin:-6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{font-size:13px;padding:3px 8px;border-radius:10px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.prop{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px dashed #cba}
.prop .info{flex:1}
.prop .pn{font-size:16px}
.prop .pp{font-size:13px;color:#666}
.prop .btn{font-size:15px;padding:8px 12px}
.owner{font-size:13px;padding:2px 6px;border-radius:6px;color:#fff}
.sub{font-size:13px;color:#666;text-align:center;margin:6px 0}
.rk{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid #ddd;font-size:16px}
.rk .no{width:2em;font-size:20px;text-align:center}
.rk .v{margin-left:auto;font-weight:bold}
#chat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(92vw,460px);z-index:8;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#chatHead{background:var(--or);color:#fff;padding:9px 14px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#chatLast{font-size:13px;opacity:.9;margin-left:10px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#chatBody{background:rgba(255,255,255,.95);height:150px;overflow:auto;padding:6px 10px;font-size:14px}
#chatBody .m{margin:2px 0;word-break:break-all}
#chatForm{display:flex;background:#fff}
#chatForm input{flex:1;border:0;padding:10px;font-size:16px;font-family:inherit;min-width:0}
#chatForm button{background:#1a7ef0;color:#fff;padding:0 16px;font-size:16px}
#chat.min #chatBody,#chat.min #chatForm{display:none}
.screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(#5ab3e8,#2a6fb0)}
.screen .card{max-width:420px;text-align:center;max-height:92vh}
.logo{font-size:30px;color:var(--or);line-height:1.15;margin:4px 0 2px;text-shadow:2px 2px 0 #fff3d6}
.logo small{display:block;font-size:16px;color:var(--br)}
.screen input[type=text]{width:100%;font-size:18px;padding:10px;border:3px solid #ccb;border-radius:12px;font-family:inherit;text-align:center;margin:6px 0}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;text-transform:uppercase}
.code{font-size:34px;letter-spacing:.15em;color:var(--br);margin:4px 0}
.lp{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid #eee;font-size:16px;text-align:left}
.lp .x{margin-left:auto;background:#eee;border-radius:8px;padding:4px 10px}
.tgl{display:flex;align-items:center;gap:8px;justify-content:center;font-size:15px;background:#fff;border-radius:10px;padding:8px}
.tgl input{width:20px;height:20px}
#qinfo{font-size:13px;color:#555;margin-top:8px}
.filebtn{font-size:13px;color:#7a5040;text-decoration:underline;cursor:pointer;display:inline-block;margin-top:4px}
.howto{text-align:left;font-size:13px;line-height:1.6;color:#555;background:#fff;border-radius:10px;padding:8px 10px;margin-top:10px}
#err{color:#d22;font-size:14px;min-height:1em}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="game" class="hidden">
  <div id="banner"></div>
  <div id="plist"></div>
  <div id="tools">
    <button id="followBtn" title="現在地へ">📍</button>
    <button id="mapBtn" title="全体地図">🗾</button>
    <button id="listBtn" title="一覧の開閉">👥</button>
  </div>
  <button id="actBtn" class="btn hidden">サイコロを振る</button>
  <div id="chat" class="min">
    <div id="chatHead"><span>💬 チャット</span><span id="chatLast"></span><span id="chatTgl">＋</span></div>
    <div id="chatBody"></div>
    <form id="chatForm"><input id="chatIn" maxlength="60" placeholder="メッセージ…" autocomplete="off"><button>送信</button></form>
  </div>
</div>
<canvas id="diceCv"></canvas>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="card" id="mcard"></div></div>

<div id="title" class="screen">
  <div class="card">
    <div class="logo">ぐらびてぃ電鉄2<small>〜日本縦断 買い占め列島〜</small></div>
    <input id="nameIn" type="text" maxlength="10" placeholder="あなたの名前">
    <div class="stack">
      <button class="btn" id="hostBtn">ルームを作る（2〜8人）</button>
      <div class="joinrow"><input id="codeIn" type="text" maxlength="6" placeholder="ルームコード"><button class="btn brown" id="joinBtn">参加</button></div>
      <button class="btn green" id="soloBtn">ひとりで遊ぶ（CPU対戦）</button>
    </div>
    <div id="err"></div>
    <div id="qinfo">📚 問題を読み込み中…</div>
    <label class="filebtn">＋ 問題ファイル(JSON)を追加で読み込む<input type="file" id="qfile" accept=".json,application/json" multiple hidden></label>
    <div class="howto">🚂 札幌から鹿児島中央をめざす旅すごろく<br>🎲 手番の人がサイコロ → 全員でご当地クイズ<br>🎯 出目でジャンルと難易度が決まる<br>　1🍜グルメ・名所 2💋恋愛・大人の雑学 3🎎祭り・名産<br>　4📺昭和平成 5📜歴史・オカルト 6🧭地理・雑学<br>⭕ 正解者は出目の数だけ進む／❌ 不正解者は出目の数だけ戻る<br>🏢 手番の人が正解したら、止まった駅の物件を買える<br>👑 駅の物件を全部買うと「独占」で収益・通行料2倍<br>💰 1手番＝1ヶ月、3ヶ月ごとに決算。最後は総資産で勝負！</div>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="card">
    <h2 style="color:var(--br);margin:0">待機室</h2>
    <div id="lobbyCode"></div>
    <div id="lobbyShare" class="joinrow" style="justify-content:center;margin:6px 0"></div>
    <div id="lobbyList" style="margin:8px 0"></div>
    <div class="stack" id="lobbyBtns"></div>
    <div class="sub" id="lobbyNote"></div>
  </div>
</div>

function addQuestions(list,src){
  let ok=0;
  for(const x of (Array.isArray(list)?list:(list&&list.questions)||[])){
    const g=+x.g, q=String(x.q||'').trim(), a=String(x.a||'').trim(), w=(x.w||[]).map(s=>String(s).trim()).filter(Boolean);
    if(!(g>=1&&g<=6) || !q || !a || w.length<3 || w.slice(0,3).includes(a)){ qLoadInfo.bad++; continue; }
    const id=qhash(q+'|'+a); if(QIDS.has(id)){ qLoadInfo.dup++; continue; }
    QIDS.add(id); const st=x.st&&IDX[x.st]!=null?IDX[x.st]:-1;
    QPOOL.push({id,g,st,q,a,w:w.slice(0,3)}); ok++;
  }
  if(src) qLoadInfo.files.push(`${src}(${ok})`);
  return ok;
}
async function loadQuestions(){

  let best=Infinity; for(const q of free) best=Math.min(best,score(q));

  c=document.createElement('canvas'); c.width=rows[0].length; c.height=rows.length; const g=c.getContext('2d');
  rows.forEach((row,r)=>{ for(let k=0;k<row.length;k++){ const ch=row[k]; const col=pal[ch]; if(ch==='.'||!col) continue; g.fillStyle=col; g.fillRect(k,r,1,1); } });
  sprCache.set(key,c); return c; }
function drawSprite(rows,x,y,s,pal,flip){
  const c=sprCanvas(rows,pal); const w=c.width*s, h=c.height*s; const ox=Math.round(x-w/2), oy=Math.round(y-h);
  ctx.imageSmoothingEnabled=false;
  if(flip){ ctx.save(); ctx.translate(ox+w,oy); ctx.scale(-1,1); ctx.drawImage(c,0,0,w,h); ctx.restore(); }
  else ctx.drawImage(c,ox,oy,w,h);
}
function drawTrain(x,y,color,s,type,flip,moving,t){
  const rows=SPR[type]||SPR.shinkansen;
  const wheelOn=Math.floor(t/90)%2===0;
  const pal={K:'#1e1a18',C:color,W:'#fbfbf6',G:'#2a4a7a',L:(Math.floor(t/300)%2||moving)?'#fff59a':'#e8d36a',Y:'#ffd23f',S:shade(color,0.6),O:moving&&wheelOn?'#777':'#4a4a4a'};
  // 影
  if(type==='plane'){ ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x,y+s*9,rows[0].length*s*0.4,s*1.3,0,0,7); ctx.fill(); }
  else if(type==='ship'){ ctx.fillStyle='rgba(255,255,255,.7)'; for(let k=0;k<3;k++){ const ph=((t/400)+k/3)%1; ctx.globalAlpha=1-ph; ctx.fillRect(x+(flip?1:-1)*(rows[0].length*s*0.5+ph*s*8)-s,y+s*0.3,s*3,s*0.8); } ctx.globalAlpha=1; }
  else { ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x,y+s*0.5,rows[0].length*s*0.48,s*1.6,0,0,7); ctx.fill(); }
  const bob=type==='plane'?Math.sin(t/300)*s*1.2:type==='ship'?Math.sin(t/350)*s*0.6:(moving?Math.round(Math.sin(t/60))*s*0.5:0);
  drawSprite(rows,x,y+bob,s,pal,flip);
  // 窓のハイライト
  if(type!=='steam'){ ctx.fillStyle='rgba(255,255,255,.35)'; }
}

    const [sx,sy]=w2s(SAKURAJIMA[0],SAKURAJIMA[1]); if(vis(sx,sy,100)){ const s=Math.max(2,3*z); drawSprite(["...KK...","..KRRK..",".KKKKKK.","KKKKKKKK"],sx,sy,s,{K:'#5a4a40',R:'#ff6a2a'},false); } }
  // 特産物・名所のマップチップ
  if(tileOk){ const showName=cam.z>1.55; ctx.imageSmoothingEnabled=true;
    for(const [x0,y0,ax,ay,sx0,sy0,iw,ih,sz,nm,kind] of TILES){
      const [x,y]=w2s(x0,y0); const w=sz*z, h=w*ih/iw; if(!vis(x,y,w+40)) continue;
      if(Math.hypot(x0-ax,y0-ay)>6){ const [px,py]=w2s(ax,ay); ctx.strokeStyle='rgba(43,36,32,.55)'; ctx.lineWidth=Math.max(1,1.2*DPR); ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y+h*0.35); ctx.stroke();
        ctx.fillStyle='#2b2420'; ctx.beginPath(); ctx.arc(px,py,Math.max(1.5,2*DPR),0,7); ctx.fill(); }
      ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x,y+h*0.45,w*0.45,w*0.12,0,0,7); ctx.fill();
      const bob=kind==='s'?Math.sin(t/900+x0)*w*0.015:0;
      ctx.drawImage(tileImg,sx0,sy0,iw,ih,x-w/2,y-h/2+bob,w,h);
      if(showName && nm){ const f=Math.round(9*DPR); ctx.font=`${f}px "DotGothic16",sans-serif`; const tw=ctx.measureText(nm).width;
        const ly=y+h/2+2*DPR; ctx.fillStyle=kind==='s'?'rgba(255,243,196,.92)':'rgba(255,255,255,.88)'; ctx.fillRect(x-tw/2-3*DPR,ly,tw+6*DPR,f+4*DPR);
        ctx.fillStyle='#2b2420'; ctx.textBaseline='top'; ctx.fillText(nm,x-tw/2,ly+2*DPR); ctx.textBaseline='alphabetic'; }
    }
    ctx.imageSmoothingEnabled=false; }
  // 線路（バラスト→枕木→レール）
  ctx.lineCap='round';
  const edges=[], sedges=[]; for(let i=0;i<ST.length;i++) for(const j of NEXT[i]) (EDGE_T[i+'>'+j]==='rail'?edges:sedges).push([i,j,EDGE_T[i+'>'+j]]);
  // 航路（点線）・空路（白い破線）
  ctx.lineCap='round';
  for(const [i,j,tp] of sedges){ const [x1,y1]=w2s(ST[i].x,ST[i].y), [x2,y2]=w2s(ST[j].x,ST[j].y);
    if(tp==='air'){ ctx.setLineDash([2*DPR,7*DPR]); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=Math.max(2,2.5*z); }
    else { ctx.setLineDash([8*DPR,6*DPR]); ctx.strokeStyle='rgba(20,60,120,.55)'; ctx.lineWidth=Math.max(3,4*z); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=Math.max(1.5,2*z); }
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=Math.max(5,9*z);
  for(const [i,j] of edges){ const [x1,y1]=w2s(ST[i].x,ST[i].y), [x2,y2]=w2s(ST[j].x,ST[j].y); ctx.beginPath(); ctx.moveTo(x1+2*DPR,y1+2*DPR); ctx.lineTo(x2+2*DPR,y2+2*DPR); ctx.stroke(); }
  ctx.strokeStyle='#a8998a'; ctx.lineWidth=Math.max(5,9*z);
  for(const [i,j] of edges){ const [x1,y1]=w2s(ST[i].x,ST[i].y), [x2,y2]=w2s(ST[j].x,ST[j].y); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  if(z>0.45){ ctx.strokeStyle='#6b4a2b'; ctx.lineWidth=Math.max(1.5,2*z); ctx.lineCap='butt';
    for(const [i,j] of edges){ const [x1,y1]=w2s(ST[i].x,ST[i].y), [x2,y2]=w2s(ST[j].x,ST[j].y); const L=Math.hypot(x2-x1,y2-y1); if(L<1) continue;
      const ux=(x2-x1)/L, uy=(y2-y1)/L, nx=-uy, ny=ux, hw=Math.max(3,5.5*z), gap=Math.max(5,7*z); ctx.beginPath();
      for(let d=gap/2; d<L; d+=gap){ const cx=x1+ux*d, cy=y1+uy*d; ctx.moveTo(cx-nx*hw,cy-ny*hw); ctx.lineTo(cx+nx*hw,cy+ny*hw); } ctx.stroke(); } }
  ctx.lineCap='round'; ctx.strokeStyle='#e9ecef'; ctx.lineWidth=Math.max(1,1.4*z);
  for(const [i,j] of edges){ const [x1,y1]=w2s(ST[i].x,ST[i].y), [x2,y2]=w2s(ST[j].x,ST[j].y); const L=Math.hypot(x2-x1,y2-y1); if(L<1) continue;
    const nx=-(y2-y1)/L, ny=(x2-x1)/L, o=Math.max(1.5,3*z); ctx.beginPath(); ctx.moveTo(x1+nx*o,y1+ny*o); ctx.lineTo(x2+nx*o,y2+ny*o); ctx.moveTo(x1-nx*o,y1-ny*o); ctx.lineTo(x2-nx*o,y2-ny*o); ctx.stroke(); }
  // 雲（影→本体）
  for(const cl of CLOUDS){ cl.x+=cl.v*dt; if(cl.x>WW+200) cl.x=-200; const s=cl.s*Math.max(1,z*1.2);
    const [sx,sy]=w2s(cl.x,cl.y); if(!vis(sx,sy,200)) continue; ctx.globalAlpha=z<0.6?0.75:0.45;
    drawSprite(CLOUD_ROWS,sx+18*DPR*Math.max(1,z),sy+26*DPR*Math.max(1,z),s,{W:'rgba(0,30,60,.25)',S:'rgba(0,30,60,.25)'},false);
    drawSprite(CLOUD_ROWS,sx,sy,s,{W:'#ffffff',S:'#dce8f2'},false); ctx.globalAlpha=1; }
  // 噴煙・汽車の煙
  for(let k=puffs.length-1;k>=0;k--){ const pf=puffs[k]; pf.life+=dt; if(pf.life>pf.max){ puffs.splice(k,1); continue; }
    pf.x+=pf.vx*dt; pf.y+=pf.vy*dt; const a=1-pf.life/pf.max; const [sx,sy]=w2s(pf.x,pf.y); const r=(pf.r+pf.life*3)*Math.max(1,z)*DPR;
    ctx.fillStyle=pf.c; ctx.globalAlpha=a*0.8; ctx.fillRect(sx-r,sy-r,r*2,r*2); ctx.globalAlpha=1; }
  // 駅
  const fs=Math.round(12*DPR);
  const bs=Math.max(0.8,Math.min(3.0,2.1*cam.z))*DPR;
  // 🔵🔴マス・航路／空路の中継点
  for(const s of ST){ if(s.kind==='st') continue; const [x,y]=w2s(s.x,s.y); if(!vis(x,y,40)) continue;
    if(s.kind==='blue'||s.kind==='red'){ const r=Math.max(4,6.5*z);
      ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x+1.5*DPR,y+2.5*DPR,r,r*0.8,0,0,7); ctx.fill();
      ctx.fillStyle=s.kind==='blue'?'#2f7de8':'#e8402f'; ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1.5,2*z);
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; const b=r*0.55, w=Math.max(1.5,r*0.22); ctx.fillRect(x-b,y-w/2,b*2,w); if(s.kind==='blue') ctx.fillRect(x-w/2,y-b,w,b*2); }
    else if(s.kind==='air'){ ctx.fillStyle='rgba(255,255,255,.95)'; ctx.strokeStyle='#7fb6e6'; ctx.lineWidth=1.5*DPR; ctx.beginPath(); ctx.arc(x,y,Math.max(2.5,3.5*z),0,7); ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#2b2420'; ctx.lineWidth=1.5*DPR; ctx.beginPath(); ctx.arc(x,y,Math.max(2.5,3.5*z),0,7); ctx.fill(); ctx.stroke(); }
  }
  for(const s of ST){ if(s.kind!=='st') continue;
    const [x,y]=w2s(s.x,s.y); if(!vis(x,y,120)) continue;
    const mono=state&&monopolist(s.i), mp=mono&&P(mono);
    // 物件の家
    if(state && z>0.5){ const offs=[[-13,7],[13,7],[0,13]]; for(let k=0;k<3;k++){ const o=ownerOf(s.i,k), op=o&&P(o); if(!op) continue;
      drawSprite(BLD.house,x+offs[k][0]*z,y+offs[k][1]*z+6*bs,bs*0.9,{R:op.color,W:'#fff',D:'#7a5a3a',G:'#7fb6e6',K:'#2b2420'},false); } }
    // 駅舎
    const rows=s.tier===3?BLD.big:s.tier===2?BLD.mid:BLD.small;
    const roof=s.i===GOAL?'#ffcf2a':mp?mp.color:(s.tier===3?'#d8402f':s.tier===2?'#2f6fd0':'#3a9a4a');
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x-rows[0].length*bs/2+bs,y+bs*0.5,rows[0].length*bs,bs*1.2);
    drawSprite(rows,x,y+bs,bs,{R:roof,W:'#fdfaf2',G:'#6fa7dd',D:'#7a5a3a',K:'#2b2420'},false);
    // 線路の結節点
    ctx.fillStyle='#fff'; ctx.strokeStyle='#2b2420'; ctx.lineWidth=2*DPR; ctx.beginPath(); ctx.arc(x,y+bs*1.5,Math.max(2.5,3*z)*DPR*0.8,0,7); ctx.fill(); ctx.stroke();
    if(state){ for(let k=0;k<3;k++){ const o=ownerOf(s.i,k), op=o&&P(o); if(op && z<=0.5){ ctx.fillStyle=op.color; ctx.fillRect(x-7*DPR+k*5*DPR,y-rows.length*bs-8*DPR,4*DPR,6*DPR); } } }
    const topY=y-rows.length*bs+bs;
    if(mp){ ctx.font=`${Math.round(fs*1.2)}px sans-serif`; ctx.fillText('👑',x-fs*0.6,topY-2*DPR+Math.sin(t/300)*2*DPR); }
    if(s.i===GOAL){ const pr=(Math.sin(t/250)+1)/2; ctx.strokeStyle=`rgba(255,210,40,${0.4+pr*0.5})`; ctx.lineWidth=3*DPR; ctx.beginPath(); ctx.arc(x,y,(22+pr*8)*DPR*Math.max(0.7,z),0,7); ctx.stroke();
      ctx.font=`${fs*1.6}px sans-serif`; ctx.fillText('🏁',x+rows[0].length*bs/2-fs*0.2,topY+Math.sin(t/200)*2*DPR); }
    if(cam.z>0.55 || s.tier===3){
      ctx.font=`${fs}px "DotGothic16",sans-serif`; const label=s.n; const tw=ctx.measureText(label).width; const r=rows[0].length*bs/2;
      let lx=x+r+3*DPR, ly=y-fs/2-2*DPR;
      if(s.lb==='l') lx=x-r-3*DPR-tw-8*DPR; else if(s.lb==='t'){ lx=x-tw/2-4*DPR; ly=topY-fs-8*DPR; } else if(s.lb==='b'){ lx=x-tw/2-4*DPR; ly=y+4*bs; }
      ctx.fillStyle='#2b2420'; ctx.fillRect(lx-DPR,ly-DPR,tw+10*DPR,fs+6*DPR);
      ctx.fillStyle=mp?mp.color:(s.tier===3?'#fff3c4':'#ffffff'); ctx.fillRect(lx,ly,tw+8*DPR,fs+4*DPR);
      ctx.fillStyle=mp?'#fff':'#2b2420'; ctx.textBaseline='top'; ctx.fillText(label,lx+4*DPR,ly+2*DPR); ctx.textBaseline='alphabetic';
    }
  }
  // 駒
  if(state && state.phase!=='lobby'){
    const groups={};
    state.players.forEach(p=>{ (groups[p.pos]=groups[p.pos]||[]).push(p); });
    const order=state.players.slice().sort((a,b)=>(a===curP())-(b===curP()));
    for(const p of order){
      const g=groups[p.pos], gi=g.indexOf(p), n=g.length; const s=ST[p.pos];
      const sp=23*2.0*Math.min(1.25,Math.max(0.65,cam.z))/cam.z*0.8; const row=n>2?(gi%2):0; const col=n>2?Math.floor(gi/2)-(Math.ceil(n/2)-1)/2:gi-(n-1)/2;
      const off=n>1?col*sp+(row?sp*0.35:0):0;
      const tx=s.x+off, ty=s.y-2+(row?14:0);
      const dp=disp[p.id]||(disp[p.id]={x:tx,y:ty,flip:false,smoke:0});
      const ddx=tx-dp.x, ddy=ty-dp.y; const moving=Math.hypot(ddx,ddy)>1.2;
      if(Math.abs(ddx)>0.8) dp.flip=ddx<0;
      dp.x+=ddx*0.25; dp.y+=ddy*0.25;
      const pidx=state.players.indexOf(p); const pk=ST[p.pos].kind; const type=pk==='air'?'plane':pk==='sea'?'ship':TRAIN_TYPES[pidx%3];
      const [x,y]=w2s(dp.x,dp.y); const isCur=p===curP()&&state.phase!=='end';
      const sc=(isCur?2.6:2.0)*DPR*Math.min(1.25,Math.max(0.65,cam.z));
      // 煙・火花
      dp.smoke-=dt; if(dp.smoke<=0){ dp.smoke=type==='steam'?(moving?0.08:0.6):type==='ship'?99:(moving?0.12:99);
        const fx=dp.x+(dp.flip?-1:1)*(type==='steam'?6:-10), fy=dp.y-(type==='steam'?18:4);
        puffs.push({x:fx,y:fy,vx:(dp.flip?6:-6)*(moving?2:0.5),vy:type==='steam'?-14:-4,life:0,max:type==='steam'?1.6:0.6,r:type==='steam'?2:1,c:type==='steam'?'#f2f2f2':(type==='densha'?'#fff27a':'#ffffff')}); }
      if(isCur){ const pr=(Math.sin(t/220)+1)/2; ctx.fillStyle=`rgba(255,90,60,${0.18+pr*0.15})`; ctx.beginPath(); ctx.ellipse(x,y,30*DPR,12*DPR,0,0,7); ctx.fill(); }
      let jy=0; const fxT=state.fx?Date.now()-fxAt:9999;
      const fxOk=fxT<1800&&state.fx.ok.includes(p.id), fxNg=fxT<1800&&state.fx.ng.includes(p.id);
      if(fxOk) jy=-Math.abs(Math.sin(fxT/130))*18*DPR*(1-fxT/1800);
      let shx=0; if(fxNg) shx=Math.sin(fxT/30)*4*DPR*(1-fxT/1800);
      drawTrain(x+shx,y+jy,p.color,sc,type,dp.flip,moving,t);
      if(fxOk){ ctx.font=`${Math.round(16*DPR)}px sans-serif`; for(let k=0;k<5;k++){ const a=k*1.26+fxT/300, rr=(24+fxT/40)*DPR; ctx.globalAlpha=1-fxT/1800; ctx.fillText('✨',x+Math.cos(a)*rr-8*DPR,y-14*DPR+Math.sin(a)*rr*0.6); } ctx.globalAlpha=1; }
      if(fxNg){ const s2=(1+fxT/600)*DPR; ctx.globalAlpha=Math.max(0,1-fxT/1800); ctx.font=`${Math.round(30*s2)}px sans-serif`; ctx.fillText('💥',x-15*s2,y-4*DPR); ctx.globalAlpha=1; }
      // 名札（＋手番の矢印）
      ctx.font=`${Math.round(11*DPR)}px "DotGothic16",sans-serif`; const tw=ctx.measureText(p.name).width;
      const ly=y-10*sc-18*DPR+jy; ctx.fillStyle='#1e1a18'; ctx.fillRect(x-tw/2-5*DPR,ly-DPR,tw+10*DPR,17*DPR);
      ctx.fillStyle=p.color; ctx.fillRect(x-tw/2-4*DPR,ly,tw+8*DPR,15*DPR);
      ctx.fillStyle='#fff'; ctx.textBaseline='top'; ctx.fillText(p.name,x-tw/2,ly+2*DPR); ctx.textBaseline='alphabetic';
      if(isCur){ const ay=ly-10*DPR+Math.sin(t/180)*3*DPR; ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#1e1a18'; ctx.lineWidth=2*DPR;
        ctx.beginPath(); ctx.moveTo(x-7*DPR,ay-6*DPR); ctx.lineTo(x+7*DPR,ay-6*DPR); ctx.lineTo(x,ay+2*DPR); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }
  }
}

requestAnimationFrame(frame);

// パン・ピンチ操作
const ptrs=new Map(); let pinch0=null;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); });
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; const prev=ptrs.get(e.pointerId); const cur={x:e.clientX,y:e.clientY}; ptrs.set(e.pointerId,cur);
  if(ptrs.size===1){ const dx=cur.x-prev.x, dy=cur.y-prev.y; if(Math.abs(dx)+Math.abs(dy)>0){ follow=false; cam.tx-=dx/cam.z; cam.ty-=dy/cam.z; cam.x=cam.tx; cam.y=cam.ty; } }
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const dist=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0){ cam.tz=Math.max(0.15,Math.min(3,cam.tz*dist/pinch0)); cam.z=cam.tz; } pinch0=dist; follow=false; }
});
const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); cam.tz=Math.max(0.15,Math.min(3,cam.tz*(e.deltaY<0?1.1:0.9))); },{passive:false});

// テスト用フック
window.__gdt={get state(){return state;},ST,NEXT,DIST,act,startHost,cam,cpuCheck};
